name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action 对组织账号（CardInfoLink）要求付费 license，
      # 直接跑官方 gitleaks 二进制规避（个人/组织均免费，无需申领）。
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact -v

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lock 里记的 workspace 版本必须与各包 package.json 一致。`npm ci` 查的是**依赖树**，
      # workspace 条目的 version 字段对不上它并不报错 —— 而 `npm ci` 严格按 lock 装，装出来
      # 的版本号就会与源码不符。2026-11 实测连漏两次（0.10.2 / 0.10.3 只改了 package.json）。
      # 放在这一步是因为它很便宜：早失败，不必等 build/test 跑完。
      - run: npm run check:lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      # workspace 内部包（如 @agenzo/cli-core）需先 build 生成 dist/，否则依赖它的
      # apps/* 测试在 vitest 里解析不到 entry（package.json main 指向 dist/index.js）。
      - run: npm run build
      - run: npm run test
      - run: npm run check:error-codes
      - run: npm audit --audit-level=high || true
